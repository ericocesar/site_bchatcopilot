<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="bg" x1="800" y1="0" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060B13"/>
      <stop offset="0.52" stop-color="#0B1420"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="panel-dark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172435" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0C141F" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="panel-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#188692" stop-opacity="0.82"/>
      <stop offset="0.52" stop-color="#146C7A" stop-opacity="0.64"/>
      <stop offset="1" stop-color="#0C2835" stop-opacity="0.94"/>
    </linearGradient>
    <radialGradient id="hub" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 450) rotate(90) scale(138)">
      <stop stop-color="#1B3443"/>
      <stop offset="0.62" stop-color="#0B1826"/>
      <stop offset="1" stop-color="#050B13"/>
